name: Pipeline Ingesta BCRA Medallion

on:
  push:
    branches: [ "main" ]
  schedule:
    # Se ejecuta automáticamente todos los días a las 09:00 UTC (6:00 AM Argentina)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite la ejecución manual desde el botón 'Run workflow'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests pandas pyarrow; fi

    - name: Ejecutar Ingesta Capa Bronze
      run: python src/ingestion/ingest_bcra_bronze.py

    - name: Ejecutar Transformación Capa Silver
      run: python src/transformation/transform_bcra_silver.py

    - name: Guardar artifactos/datos generados
      uses: actions/upload-artifact@v4
      with:
        name: bcra-data-output
        path: data/
