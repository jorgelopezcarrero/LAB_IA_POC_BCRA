name: Pipeline Medallion BCRA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas pyarrow

    - name: Ejecutar Ingesta Capa Bronze
      run: python src/bronze/ingest_bcra_bronze.py

    - name: Ejecutar Transformación Capa Silver
      run: python src/silver/transform_bcra_silver.py

    - name: Ejecutar Agregación Capa Gold
      run: python src/gold/transform_bcra_gold.py

    - name: Guardar datos generados
      uses: actions/upload-artifact@v4
      with:
        name: bcra-medallion-output
        path: data/
